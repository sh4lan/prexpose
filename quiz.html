<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prexpose – Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>(function(){var t=localStorage.getItem('primerTheme');if(t&&t!=='light')document.documentElement.classList.add(t)})()</script>
</head>
<body>
  <div class="app app--wide">
    <section class="status-bar">
      <span class="stat">Quiz</span>
      <span id="quizProgress" class="stat"></span>
      <span class="bar-spacer"></span>
      <button id="quizContextBtn" class="btn btn-text">Context</button>
      <button id="quizFiltersBtn" class="btn btn-text">Filters</button>
      <a href="index.html" class="btn btn-text btn-back">&larr; Back</a>
    </section>

    <div class="quiz-main">
      <!-- Clickable word navigator: a scrollable horizontal strip, no scrollbar -->
      <div class="quiz-nav">
        <div id="quizNavStrip" class="quiz-nav-strip"></div>
      </div>

      <div class="quiz-sentence-area">
        <button id="quizPrevSentBtn" class="quiz-sentence-zone quiz-sentence-zone--left" aria-label="Previous sentence" disabled>&larr;</button>
        <p id="quizSentence" class="quiz-sentence"></p>
        <button id="quizNextSentBtn" class="quiz-sentence-zone quiz-sentence-zone--right" aria-label="Next sentence" disabled>&rarr;</button>
      </div>

      <div class="quiz-controls">
        <span id="quizSentPos" class="quiz-sent-pos stat"></span>
        <span class="bar-spacer"></span>
        <button id="quizAddKnownBtn" class="btn btn-add hidden">Add to known</button>
      </div>
    </div>
  </div>

  <!-- Filters drawer -->
  <div id="quizFiltersPanel" class="quiz-filters-panel hidden">
    <div class="quiz-filters-backdrop"></div>
    <div class="quiz-filters-drawer">
      <div class="quiz-filters-head">
        <span class="quiz-filters-title">Filters</span>
        <span class="bar-spacer"></span>
        <button class="btn btn-text quiz-filters-close" aria-label="Close filters">&times;</button>
      </div>
      <div class="quiz-filters-body">
        <div class="quiz-filter-block">
          <div class="quiz-filter-label">New words per sentence <span class="quiz-filter-val" id="valMaxNew"></span></div>
          <div class="dual-range">
            <div class="dual-range-track"><div class="dual-range-fill" id="fillMaxNew"></div></div>
            <input type="range" id="rngMaxNew" class="dual-range-input dual-range-max" step="1">
          </div>
        </div>
        <div class="quiz-filter-block">
          <div class="quiz-filter-label">Sentence length <span class="quiz-filter-val" id="valLen"></span></div>
          <div class="dual-range">
            <div class="dual-range-track"><div class="dual-range-fill" id="fillLen"></div></div>
            <input type="range" id="rngMinLen" class="dual-range-input dual-range-min" step="1">
            <input type="range" id="rngMaxLen" class="dual-range-input dual-range-max" step="1">
          </div>
        </div>
        <div class="quiz-filter-block">
          <div class="quiz-filter-label">Occurrences <span class="quiz-filter-val" id="valOcc"></span></div>
          <div class="dual-range">
            <div class="dual-range-track"><div class="dual-range-fill" id="fillOcc"></div></div>
            <input type="range" id="rngMinOcc" class="dual-range-input dual-range-min" step="1">
            <input type="range" id="rngMaxOcc" class="dual-range-input dual-range-max" step="1">
          </div>
        </div>
        <div class="quiz-filter-block" id="rankBlock">
          <div class="quiz-filter-label">Dictionary rank <span class="quiz-filter-val" id="valRank"></span></div>
          <div class="dual-range">
            <div class="dual-range-track"><div class="dual-range-fill" id="fillRank"></div></div>
            <input type="range" id="rngMinRank" class="dual-range-input dual-range-min" step="1">
            <input type="range" id="rngMaxRank" class="dual-range-input dual-range-max" step="1">
          </div>
        </div>
        <div class="quiz-filter-block">
          <div class="quiz-filter-label">Kana</div>
          <label class="control-item">
            <input type="checkbox" id="quizHideHiraganaCheckbox"> Hide hiragana
          </label>
          <label class="control-item">
            <input type="checkbox" id="quizHideKatakanaCheckbox"> Hide katakana
          </label>
        </div>
      </div>
      <div class="quiz-filters-foot">
        <button id="quizFiltersReset" class="btn btn-text">Reset</button>
      </div>
    </div>
  </div>

  <!-- Context popup -->
  <div id="quizContextModal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content modal-content-wide">
      <div class="modal-header">
        <h3>Context</h3>
        <span class="bar-spacer"></span>
        <button class="modal-close btn btn-text" aria-label="Close context">&times;</button>
      </div>
      <div id="quizContextPanel" class="quiz-context-panel"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/build/kuromoji.js"></script>
  <script type="module" src="src/quiz.js"></script>
</body>
</html>
