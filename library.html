<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prexpose – Manage Words</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <script>(function(){var t=localStorage.getItem('primerTheme');if(t&&t!=='light')document.documentElement.classList.add(t)})()</script>
</head>
<body>
  <div class="app">
    <section class="status-bar">
      <span class="stat">Manage</span>
      <span class="bar-spacer"></span>
      <a href="sessions.html" class="btn btn-text">Sessions</a>
      <a href="stats.html" class="btn btn-text">Stats</a>
      <a href="options.html" class="btn btn-text">Options</a>
      <a href="index.html" class="btn btn-text btn-back">&larr; Back</a>
    </section>

    <div id="libraryList" class="word-list"></div>
    <div id="libraryEmpty" class="empty-state">
      <p>No known words yet.</p>
    </div>
  </div>

  <script type="module" src="src/manage.js"></script>
</body>
</html>
